name: Mensaplan aktualisieren
on:
  schedule:
    - cron: "15 4 * * 1-6"   # Mo–Sa ca. 05:15/06:15 Uhr deutscher Zeit
    - cron: "15 15 * * 0"    # So nachmittag für die neue Woche
  workflow_dispatch:
permissions:
  contents: write
concurrency: mensa
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4==4.12.3
      - run: python scripts/mensa.py
      - name: Commit und auf gh-pages veröffentlichen
        run: |
          git config user.name "mensa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mensa.json
          if git diff --cached --quiet; then echo "keine Änderung"; else git commit -m "Mensaplan aktualisiert"; git push origin HEAD:main; fi
          git push origin HEAD:gh-pages --force
